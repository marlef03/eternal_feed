name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: eternal_feed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d eternal_feed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/eternal_feed_test
      TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/eternal_feed_test
      JWT_SECRET_KEY: ci-only-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q
