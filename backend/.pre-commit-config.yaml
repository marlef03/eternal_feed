repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: uv-ruff-check
        name: ruff
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: uv-ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
        pass_filenames: false

  - repo: local
    hooks:
      - id: uv-mypy
        name: mypy
        entry: uv run --frozen --directory=backend mypy
        language: system
        types: [python]
        files: ^backend/(main\.py|src/)
        pass_filenames: false
